name: nimbus_field_app
description: Field worker app for Nimbus MFI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & API
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage (Offline DB & Secure Tokens)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  image_picker: ^1.0.7
  
  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
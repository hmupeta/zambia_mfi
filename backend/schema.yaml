openapi: 3.0.3
info:
  title: Zambia MFI Platform API
  version: 1.0.0
  description: |
    Multi-tenant, multi-branch loan management platform for Zambian microfinance institutions.

    **Tenancy model:** Every request is scoped to the caller's organization (tenant), derived from the JWT. Platform admins can see all tenants; tenant users see only their own.

    **Roles:** `HQ_ADMIN`, `BRANCH_MANAGER`, `LOAN_OFFICER`, `TELLER`.

    **How to authenticate:**
    1. `POST /api/auth/token/` with `{"username","password"}`
    2. Copy the `access` token
    3. Click **Authorize** above and paste it (Swagger auto-prefixes "Bearer ")
  contact:
    name: Zambia MFI Platform
    email: platform@zambiamfi.local
  license:
    name: Proprietary
paths:
  /api/accounting/accounts/:
    get:
      operationId: api_accounting_accounts_list
      description: Scope querysets to the user's organization.
      parameters:
      - in: query
        name: account_type
        schema:
          type: string
          enum:
          - ASSET
          - EQUITY
          - EXPENSE
          - INCOME
          - LIABILITY
        description: |-
          * `ASSET` - Asset
          * `LIABILITY` - Liability
          * `EQUITY` - Equity
          * `INCOME` - Income
          * `EXPENSE` - Expense
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_contra
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGLAccountList'
          description: ''
    post:
      operationId: api_accounting_accounts_create
      description: Scope querysets to the user's organization.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GLAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GLAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GLAccountRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccount'
          description: ''
  /api/accounting/accounts/{id}/:

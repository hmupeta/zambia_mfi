tags:
- name: Auth
  description: |-
    ## Authentication

    Issues and refreshes JSON Web Tokens (JWT). Every other endpoint requires a valid access token passed as `Authorization: Bearer <token>`.

    **Flow:**
    1. `POST /api/auth/token/` with `{username, password}`
    2. Receive `{access, refresh}`
    3. Send `access` on subsequent requests
    4. When `access` expires (12h), use `refresh` on `/api/auth/token/refresh/`

    **JWT claims:** `user_id`, `username`, `role`, `organization_id`, `organization_code`, `branch_id`, `branch_code`, `is_platform_admin`.
- name: Organizations
  description: |-
    ## Tenant Management (Platform Admin Only)

    A **tenant** is one microfinance institution. Root of the multi-tenant hierarchy - all branches, users, clients, loans, payments, and journals are scoped to exactly one organization.

    **Only users with `is_platform_admin = true` can call these endpoints.**

    **Onboarding flow:**
    1. `POST /api/auth/organizations/` - create the tenant
    2. (System) auto-creates an HQ branch
    3. Create the tenant's first HQ admin user
    4. Seed the Chart of Accounts via management command

    **Subscription tiers:** `TRIAL`, `BASIC`, `PRO`, `ENTERPRISE`.
- name: Branches
  description: |-
    ## Branch Management

    Operating units within a tenant. Each branch has its own wallet, client portfolio, loan book, and payment stream.

    **Hierarchy:** Model HQ -> Regional -> Branch via `parent_branch`. Every tenant must have exactly one `is_hq = true` branch.

    **Visibility:** `HQ_ADMIN` sees all branches; other roles see only their own.
- name: Users
  description: |-
    ## Staff Management

    ### Roles
    | Role | Scope | Duties |
    |------|-------|--------|
    | `HQ_ADMIN` | Whole tenant | Branches, users, products, reports |
    | `BRANCH_MANAGER` | Own branch | Approve/disburse loans |
    | `LOAN_OFFICER` | Own branch | Create clients, originate loans |
    | `TELLER` | Own branch | Record payments, manage cash |

    Every user must belong to an `organization` (except platform admins). Regular staff must also have a `branch`.

    **Password policy:** Minimum 10 characters.
- name: Clients
  description: |-
    ## Borrower Records

    Full KYC profile per borrower, scoped to one organization and one branch.

    **KYC status:** `PENDING` -> `VERIFIED` (or `REJECTED`). Only `VERIFIED` clients should receive loans.

    **NRC is unique per organization** - the same person can be a client of two different MFIs on the platform.
- name: Client Payment Channels
  description: |-
    ## Client Payment Channels

    Mobile money accounts, bank accounts, or cash-designated channels for each client. Used to route disbursements and recognize inbound repayments.

    **Channel types:** `MTN_MOMO`, `AIRTEL_MONEY`, `BANK`, `CASH`.

    A client can have multiple channels; mark one as `is_default = true` to auto-select it during disbursement.
- name: Guarantors
  description: |-
    ## Guarantors

    Co-signers who back a client's loan. Common for individual loans and group lending where the group collectively guarantees each member.

    Stores: name, NRC, phone, relationship to the client, occupation, and monthly income - used during loan appraisal to assess the strength of the guarantee.
- name: Client Documents
  description: |-
    ## Client Documents

    Scanned and uploaded documents attached to a client profile.

    **Document types:** `NRC`, `PASSPORT`, `COLLATERAL`, `GUARANTEE_LETTER`.

    Every upload records who uploaded it and when - for KYC audit trails.

    **Storage:** Files are stored under `media/clients/documents/` and referenced by URL. In production, swap to S3 or equivalent.
- name: Loan Products
  description: |-
    ## Loan Products

    Templates that define the parameters for a class of loans.

    **Key parameters:**
    - Amount range (min/max)
    - Tenure (months)
    - Interest method: `FLAT`, `REDUCING_BALANCE`, `DAILY`
    - Interest rate and penalty rate
    - Repayment frequency: `DAILY`, `WEEKLY`, `BIWEEKLY`, `MONTHLY`
    - Grace period (days)
    - Whether guarantor or collateral is required

    **Only `HQ_ADMIN` can create or edit products.** Each product can be scoped to specific branches via Branch Loan Products.
- name: Branch Loan Products
  description: |-
    ## Branch Loan Products

    Maps a loan product to specific branches. Use this when a product should only be offered at certain locations (e.g. an agricultural loan only at rural branches).

    **Creating a mapping means the product is available at that branch.** Removing it disables the product for new loans at that branch, but existing loans remain unaffected.

    **Only `HQ_ADMIN` can manage mappings.**
- name: Loan Groups
  description: |-
    ## Loan Groups (Solidarity Lending)

    Groups of clients who collectively guarantee each other's loans - a classic microfinance model.

    Each group has:
    - A **leader** (usually the longest-standing member)
    - A **branch** of operation
    - A set of **members** managed via the Loan Group Members endpoint

    Group loans use these entities to establish joint liability: if one member defaults, the group is collectively responsible.
- name: Loan Group Members
  description: |-
    ## Loan Group Members

    Links clients into loan groups and designates the group leader.

    **Rules:**
    - A client can belong to only one group at a time
    - Exactly one member should be marked `is_leader = true`
    - A member cannot be added to a group in a different organization

    When a group loan is disbursed, all members become jointly liable for repayment.
- name: Loans
  description: |-
    ## Loan Lifecycle

    ### Status flow
    `PENDING` -> `APPROVED` -> `ACTIVE` (after disburse) -> `CLOSED`
    Or `DEFAULTED` if written off.

    ### Actions
    - `POST /loans/{id}/approve/` - Branch Manager or HQ
    - `POST /loans/{id}/disburse/` - auto-posts GL entry
    - `GET  /loans/{id}/schedule/` - full installment plan

    ### Interest methods
    - **FLAT** - simple interest on original principal
    - **REDUCING_BALANCE** - interest on outstanding principal (annuity)
    - **DAILY** - daily accrual, common in payday-style products
- name: Workflow Templates
  description: |-
    ## Loan Workflow Templates

    Configurable approval pipelines. Each template has ordered stages with role requirements and SLAs.

    ### Example
    1. Loan Officer Review (LOAN_OFFICER, 24h SLA)
    2. Branch Manager Approval (BRANCH_MANAGER, 48h SLA, **final**)

    **Only `HQ_ADMIN`** can manage templates.
- name: Loan Applications
  description: |-
    ## Loan Origination

    A client's request for credit before it becomes a Loan.

    ### Status flow
    `DRAFT` → `SUBMITTED` → `UNDER_REVIEW` → `APPROVED` / `REJECTED`
    (or `RETURNED`, `WITHDRAWN`)

    ### Workflow actions
    - `POST .../submit/` — submit for review
    - `POST .../advance/` — move to next stage (approves if final stage)
    - `POST .../reject/` — reject the application
    - `POST .../return_to_applicant/` — send back to first stage
    - `POST .../withdraw/` — withdraw

    ### On approval
    A `Loan` record is created automatically in `APPROVED` status, ready to disburse.
- name: Origination - Documents
  description: Supporting documents attached to applications (NRC, payslips, bank
    statements, collateral photos).
- name: Origination - Transitions
  description: Immutable log of every stage change. Read-only.
- name: Origination - Reviews
  description: 'Reviewer notes with recommendations: approve / reject / return / flag.'
- name: Tasks
  description: |-
    ## Task Management

    Follow-up tasks assigned to users. Polymorphic — links to loan applications, loans, clients, or general.

    ### Use cases
    - Approval queue items (auto-created on stage transitions)
    - Client visit follow-ups
    - Payment reminders
    - Disbursement queue

    ### Filtering
    Use `?assigned_to=<user-id>` to see a specific user's tasks, or `GET /api/origination/tasks/mine/` for the caller's own.
- name: Installments
  description: |-
    ## Loan Installments

    The repayment schedule of a loan - one row per installment. Generated when the loan is created, based on the product's repayment frequency.

    **Each installment tracks:**
    - Due date and installment number
    - Principal, interest, penalty (expected)
    - Amount paid so far
    - Status: `PENDING`, `PARTIAL`, `PAID`, `OVERDUE`

    **Read-only endpoint** - installments are updated automatically by the payment allocation engine. Manual edits are not permitted.
- name: Payments
  description: |-
    ## Payment Recording

    Captures every repayment against a loan.

    ### What happens when you POST a payment
    1. Find the oldest unpaid installments
    2. Allocate across **principal -> interest -> penalty**
    3. Update installment balances and statuses
    4. Update the loan `balance_due` (close loan if fully paid)
    5. **Post a balanced journal entry** - `DR Cash/Bank/MoMo` / `CR Loans Receivable + Interest Income + Penalty Income`
    6. Update the branch wallet

    ### Payment methods
    `CASH`, `MTN_MOMO`, `AIRTEL_MONEY`, `BANK`

    **Atomicity:** If the journal entry fails, the entire payment rolls back. The books never go out of balance.
- name: Payment Allocations
  description: |-
    ## Payment Allocations

    Shows exactly how a single payment was split across installments and across principal / interest / penalty components.

    Every payment produces one or more allocation records - one per installment it touched.

    **Read-only** - allocations are created by the payment engine and are the audit trail behind GL entries.
- name: Wallets
  description: |-
    ## Branch Wallets

    Each branch maintains three running balances:
    - **Cash on hand** - physical cash in the branch vault
    - **Mobile money** - combined MTN MoMo + Airtel Money balance
    - **Bank** - funds in the branch operating account

    Use `GET /payments/wallets/my_wallet/` to fetch the caller's branch wallet without needing its UUID.

    Wallets are updated automatically by payments and disbursements. Manual reconciliation via `last_reconciled_at`.
- name: Wallet Transactions
  description: |-
    ## Wallet Transactions

    Every movement in or out of a branch wallet: disbursements, loan collections, transfers between branches, and expenses.

    **Transaction types:** `DISBURSEMENT`, `LOAN_COLLECTION`, `TRANSFER_IN`, `TRANSFER_OUT`, `EXPENSE`.

    **Read-only** - each record carries a reference to the source document (payment number, loan number, or transfer ref) for reconciliation.
- name: Accounting - Chart of Accounts
  description: |-
    ## Chart of Accounts (General Ledger)

    Each tenant has its own Chart of Accounts, seeded via `python manage.py seed_chart_of_accounts`.

    ### Account types
    | Type | Prefix | Normal balance |
    |------|--------|----------------|
    | Asset | 1xxx | Debit |
    | Liability | 2xxx | Credit |
    | Equity | 3xxx | Credit |
    | Income | 4xxx | Credit |
    | Expense | 5xxx | Debit |

    **Key accounts:** `1010` Cash, `1020` Bank, `1030` MoMo, `1100` Loans Receivable, `1130` Interest Receivable, `1200` Allowance for Loan Losses, `2300` Loan Loss Provision, `4000` Interest Income, `5000` Loan Loss Expense.

    **Only `HQ_ADMIN` can create, edit, or deactivate accounts.** Once used in a posted entry, an account cannot be deleted.
- name: Accounting - Journal Entries
  description: |-
    ## Double-Entry Journal Entries

    Every financial event produces one balanced `JournalEntry` with two or more `JournalLine` legs. Debits must equal credits.

    ### Automatically generated by
    - **Loan Disbursement** - `DR Loans Receivable` / `CR Cash or MoMo`
    - **Loan Repayment** - `DR Cash or MoMo` / `CR Loans Receivable + Interest + Penalty`
    - **Interest Accrual** (daily job) - `DR Interest Receivable` / `CR Interest Income`
    - **Penalty Accrual** - `DR Penalties Receivable` / `CR Penalty Income`
    - **Loan Loss Provision** - `DR Loan Loss Expense` / `CR Loan Loss Provision`
    - **Write-Off** - `DR Loan Loss Provision` / `CR Loans Receivable`

    ### Source tracking
    Each entry stores `source_type` and `source_id` for full drill-through.

    ### Manual entries
    Use `POST /accounting/journal-entries/manual/` for adjustments.

    ### Reversal
    Entries are **never deleted** - reverse via the reversal mechanism.
- name: Accounting - Provisions
  description: |-
    ## Loan Loss Provisioning

    Implements the **Bank of Zambia Microfinance Classification & Provisioning Directives, 2018**.

    | Days Past Due | Classification | Provision |
    |---------------|----------------|-----------|
    | 0 | Performing | 1% |
    | 1-30 | Watch | 5% |
    | 31-90 | Substandard | 25% |
    | 91-180 | Doubtful | 75% |
    | 181+ | Loss | 100% |

    POST `/accounting/provisions/run/` triggers provisioning for the tenant: computes DPD, classifies, and posts the **movement** to the GL.

    **Should run daily** via scheduler. Idempotent per date.
- name: Accounting - Financial Statements
  description: |-
    ## Financial Statements

    Real-time reports derived directly from the General Ledger - no batch jobs, no manual aggregation.

    ### Trial Balance
    `GET /accounting/reports/trial-balance/?as_of=YYYY-MM-DD`

    ### Income Statement (P&L)
    `GET /accounting/reports/income-statement/?from=YYYY-MM-DD&to=YYYY-MM-DD`

    ### Balance Sheet
    `GET /accounting/reports/balance-sheet/?as_of=YYYY-MM-DD` - includes a `balanced` boolean verifying the accounting equation.

    **All statements are tenant-scoped.**
- name: Accounting - BoZ Reports
  description: |-
    ## Bank of Zambia Prudential Returns

    Regulatory reports required under the **Banking and Financial Services Act, 2026**.

    ### NPL Return
    `GET /accounting/reports/npl-return/?as_of=YYYY-MM-DD`

    ### Portfolio at Risk
    `GET /accounting/reports/portfolio-at-risk/?as_of=YYYY-MM-DD` - returns PAR 1, PAR 7, PAR 30, PAR 60, PAR 90 as percentages.

    **BoZ benchmarks:** PAR 30 under 5% and PAR 90 under 3% for a healthy book.

    **Only `HQ_ADMIN`** can access the full NPL return. PAR is available to HQ and Branch Managers.
- name: Notifications - Templates
  description: |-
    ## Notification Templates

    Reusable message templates for SMS and WhatsApp.

    ### Placeholder syntax
    Use `{{variable}}` in the template body:
    - `LOAN_DISBURSED`: `{{first_name}}`, `{{loan_number}}`, `{{amount}}`, `{{maturity_date}}`
    - `PAYMENT_RECEIVED`: `{{first_name}}`, `{{amount}}`, `{{loan_number}}`, `{{payment_number}}`, `{{balance}}`
    - `PAYMENT_DUE`: `{{first_name}}`, `{{amount}}`, `{{due_date}}`, `{{loan_number}}`
    - `OVERDUE_NOTICE`: `{{first_name}}`, `{{loan_number}}`, `{{days_overdue}}`, `{{amount}}`

    **Only `HQ_ADMIN`** can create or edit templates.
- name: Notifications - Logs
  description: |-
    ## Notification Logs

    Immutable log of every SMS/WhatsApp message sent.

    ### What's captured
    - Recipient phone + name
    - Channel, template code, rendered body
    - Provider response (Africa's Talking / WhatsApp Cloud)
    - Status: `QUEUED`, `SENT`, `DELIVERED`, `FAILED`
    - Timestamps, error messages, retry count

    ### Automatic sends
    Messages are triggered automatically by:
    - **Loan disbursement** — via signal on `Loan.status`
    - **Payment received** — via signal on `Payment` creation
    - **Due-date reminders** — via scheduled management command
    - **Overdue notices** — via scheduled management command

    ### Ad-hoc test
    HQ admins can use `POST /api/notifications/logs/send_test/` to send a one-off message for testing.
- name: Loan Restructures
  description: |-
    ## Loan Restructuring & Payment Plans

    Reschedule active loans when borrowers fall behind.

    ### Restructure types
    - `EXTEND_TERM` - spread balance over more installments
    - `REDUCE_AMOUNT` - smaller installments, same term
    - `MORATORIUM` - payment holiday for N days
    - `REFINANCE` - combine with new terms

    ### Workflow
    `PROPOSED` -> `APPROVED` -> `APPLIED`
    (or `REJECTED` at the PROPOSED stage)

    ### What happens on APPLY
    1. Old unpaid installments are removed
    2. New schedule is generated from the approved terms
    3. Loan balance and maturity are updated
    4. Penalties (if waived) generate a GL entry
    5. Every step is logged in `RestructureEvent`

    **Propose:** any branch staff. **Approve/Reject:** Branch Manager or HQ. **Apply:** HQ only.
- name: KYC - Requirements
  description: |-
    ## KYC Document Requirements

    Configurable per client type + risk level.

    ### Risk levels
    - `LOW` — minimal docs (NRC, photo)
    - `MEDIUM` — plus address proof, income proof
    - `HIGH` — plus bank statements, extra review
    - `PEP` — Enhanced Due Diligence required

    **FIC Zambia requires 10-year retention of all KYC records.**
- name: KYC - Verifications
  description: |-
    ## KYC Verification Workflow

    ### Status flow
    `NOT_STARTED` → `IN_PROGRESS` → `PENDING_REVIEW` → `VERIFIED`
    (or `REJECTED`, `EXPIRED`)

    ### Actions
    - `POST .../initiate/` — start verification for a client
    - `POST .../run_checks/` — run automated ID/AML/PEP checks
    - `POST .../verify/` — mark as verified (manager+)
    - `POST .../reject/` — reject with reason
    - `GET  .../completion/` — see missing required documents

    **Providers:** Smile ID, VOVE ID, or manual fallback. Configured via `KYC.PROVIDER` in settings.
- name: KYC - Documents
  description: Uploaded KYC files with OCR extraction and verification status.
- name: KYC - Checks
  description: 'Individual check results: ID verification, OCR, face match, liveness,
    AML, PEP.'
- name: KYC - Risk
  description: |-
    ## Risk Assessments

    Computed from client data: age, location, occupation, PEP/sanctions hits.

    Levels: `LOW` `MEDIUM` `HIGH` `PEP`. Higher levels require more documents and more frequent re-review.
- name: KYC - Review Schedule
  description: Periodic re-verification reminders. High-risk clients reviewed yearly,
    low-risk every 3 years.
- name: KYC - Self Service
  description: |-
    ## Client Self-Service KYC

    Generate a one-time token, send it to the client, and they can submit their KYC documents online without logging in.

    ### Flow
    1. Staff calls `POST /api/kyc/self-service/generate_token/`
    2. Token link sent via SMS/WhatsApp
    3. Client opens link, uploads documents, submits
    4. Staff reviews and verifies
- name: Reports
  description: |-
    ## Operational Reports

    Non-financial analytics for dashboards.

    - `GET /reports/dashboard/` - KPIs for caller's scope
    - `GET /reports/daily-collections/` - payments by branch
    - `GET /reports/loan-portfolio/` - breakdown by product
    - `GET /reports/branch-performance/` - HQ-only comparison
- name: Audit
  description: |-
    ## System Activity Log

    Immutable audit trail of every write operation. Captures who, what, when, how (old/new JSON snapshots), and where from (IP).

    **Read-only** - records are written by the system, never modified.

    Essential for fraud investigations, regulatory inspections, and client dispute resolution.

    Filter by `action`, `entity_type`, `user`, or `branch`.
- name: Accounting - Bank Accounts
  description: |-
    ## Bank Accounts

    Each bank account held by a branch. Links the physical bank account to the General Ledger account that mirrors it (typically `1020 Bank`).

    **Fields:** bank name, account number, currency, opening balance, and the linked GL account.

    **Only `HQ_ADMIN`** can create or edit bank accounts.
- name: Accounting - Bank Statements
  description: |-
    ## Bank Statements

    A statement issued by the bank for a period. Each statement holds a list of transaction lines that must be matched against GL entries.

    ### Workflow
    1. Create a statement with period + opening/closing balances
    2. Add or import statement lines
    3. `POST /accounting/bank-statements/{id}/auto_match/` — auto-match against GL
    4. Manually resolve any leftover unmatched lines
    5. `POST /accounting/bank-statements/{id}/reconcile/` — compute the report

    **Status flow:** `DRAFT` → `IN_PROGRESS` → `RECONCILED`
- name: Accounting - Bank Statement Lines
  description: |-
    ## Bank Statement Lines

    Individual transactions on a bank statement. Each line can be matched to exactly one `JournalLine` on the linked bank GL account.

    ### Match statuses
    - `UNMATCHED` — no journal entry found
    - `AUTO_MATCHED` — matched by the auto-match engine
    - `MANUAL_MATCHED` — confirmed by a user
    - `EXCLUDED` — deliberately ignored (e.g., informational lines)

    ### Manual operations
    - `POST .../manual_match/` with `{"journal_line_id": N}`
    - `POST .../unmatch/` — clear the match
    - `POST .../exclude/` — exclude from reconciliation
- name: Accounting - Bank Reconciliations
  description: |-
    ## Bank Reconciliations

    Immutable snapshots of a reconciliation session. Every time you run `POST /accounting/bank-statements/{id}/reconcile/`, a new snapshot is saved showing:

    - Statement opening/closing balances
    - GL opening/closing balances
    - Reconciled difference
    - `is_reconciled` flag (true when difference = 0)

    **Read-only** — created by the system on demand.
- name: Expenses
  description: |-
    ## Operating Expenses

    Record and approve day-to-day costs: rent, salaries, fuel, utilities, bank charges, licenses.

    ### Workflow
    `DRAFT` -> `SUBMITTED` -> `APPROVED` -> `PAID`
    (or `REJECTED` at the SUBMITTED stage)

    ### GL posting
    When marked `PAID`, the system posts:
    - `DR <category expense account>`
    - `CR Cash / Bank / Mobile Money`

    ### Approval rules
    Each category can require approval and set a threshold amount. Above the threshold, only `HQ_ADMIN` can approve.
- name: Expense Categories
  description: |-
    ## Expense Categories

    Groups expenses by type and maps each to a GL account.

    **Standard categories seeded on onboarding:**
    - RENT  - Rent (5200 Operating Expenses)
    - SAL   - Salaries (5300 Salaries and Wages)
    - UTIL  - Utilities (5200)
    - FUEL  - Fuel and Transport (5200)
    - BANK  - Bank Charges (5200)
    - LIC   - Licenses and Fees (5200)
    - OFFC  - Office Supplies (5200)

    **Only `HQ_ADMIN`** can create or edit categories.

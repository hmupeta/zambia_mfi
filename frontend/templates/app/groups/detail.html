{% extends "app/base_app.html" %}
{% block title %}Group — Nimbus{% endblock %}
{% block page_title %}Group Detail{% endblock %}

{% block content %}
<div x-data="groupDetail('{{ group_id }}')" x-init="init()">

  <!-- Breadcrumbs -->
  <nav class="flex items-center gap-1.5 text-[12.5px] text-[var(--ink-3)] mb-5">
    <a href="/app/dashboard/" class="hover:text-[var(--ink)] transition">Dashboard</a>
    <svg class="w-3.5 h-3.5 text-[var(--ink-4)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    <a href="/app/groups/" class="hover:text-[var(--ink)] transition">Groups</a>
    <svg class="w-3.5 h-3.5 text-[var(--ink-4)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    <span class="text-[var(--ink)] font-medium" x-text="group?.group_name || 'Loading…'"></span>
  </nav>

  <!-- Flash Messages -->
  <div x-show="flashError" x-cloak class="mb-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-[13.5px] text-red-800" x-text="flashError"></div>
  <div x-show="flashSuccess" x-cloak class="mb-6 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-[13.5px] text-emerald-800" x-text="flashSuccess"></div>

  <!-- Loading Skeleton -->
  <div x-show="loading" class="animate-pulse">
    <div class="h-40 rounded-2xl bg-[var(--border)] mb-6"></div>
    <div class="h-64 rounded-2xl bg-[var(--border)]"></div>
  </div>

  <!-- Main Content -->
  <template x-if="group && !loading">
    <div>

      <!-- Header -->
      <div class="flex items-start justify-between gap-4 flex-wrap mb-6">
        <div>
          <div class="flex items-center gap-3 flex-wrap mb-2">
            <h2 class="font-display text-[28px] sm:text-[32px] leading-tight tracking-tight" x-text="group.group_name"></h2>
            <span class="pill" :class="statusPill(group.status)" x-text="prettyStatus(group.status)"></span>
          </div>
          <p class="text-[13px] text-[var(--ink-3)] font-mono" x-text="group.group_code + ' · ' + group.branch_code"></p>
          <p class="text-[12.5px] text-[var(--ink-3)] mt-2" x-show="group.meeting_day">
            Meets <span x-text="group.meeting_day"></span> · <span x-text="group.meeting_frequency.toLowerCase()"></span>
          </p>
        </div>
        
        <!-- Action Buttons -->
        <div class="flex gap-2 flex-wrap justify-end">
          <button x-show="group.status === 'FORMING'" @click="startCycle()" class="btn-primary !py-2.5 !px-5 !text-[13px] !w-auto">
            Start Cycle
          </button>
          
          <button x-show="group.status === 'ACTIVE'" @click="promptCollection()" class="btn-primary !py-2.5 !px-5 !text-[13px] !w-auto inline-flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>
            Record Collection
          </button>
          
          <button x-show="group.status === 'ACTIVE'" @click="promptSavings()" class="btn-secondary !py-2.5 !px-5 !text-[13px] !w-auto inline-flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
            Record Savings
          </button>
          
          <button x-show="group.status === 'ACTIVE'" @click="promptMeeting()" class="btn-secondary !py-2.5 !px-4 !text-[13px] !w-auto">
            Schedule Meeting
          </button>
          
          <button x-show="group.status === 'ACTIVE'" @click="closeCycle()" class="px-4 py-2.5 text-[13px] font-medium rounded-xl border border-red-200 text-red-700 hover:bg-red-50 transition">
            Close Cycle
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div x-show="group.summary" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="card p-5">
          <p class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono">Members</p>
          <p class="font-display text-[28px] mt-2 tabular-nums" x-text="group.summary?.member_count || 0"></p>
        </div>
        <div class="card p-5">
          <p class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono">Portfolio</p>
          <p class="font-display text-[28px] mt-2 tabular-nums" x-text="fmtMoney(group.summary?.portfolio)"></p>
        </div>
        <div class="card p-5">
          <p class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono">PAR 30</p>
          <p class="font-display text-[28px] mt-2 tabular-nums"
             :class="(group.summary?.par_ratio || 0) > 5 ? 'text-red-700' : 'text-emerald-700'"
             x-text="(group.summary?.par_ratio || 0).toFixed(2) + '%'"></p>
        </div>
        <div class="card p-5">
          <p class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono">Savings Pool</p>
          <p class="font-display text-[28px] mt-2 tabular-nums text-emerald-700" x-text="fmtMoney(group.summary?.savings_balance)"></p>
        </div>
      </div>

      <!-- Tabs -->
      <div class="border-b border-[var(--border)] mb-6">
        <div class="flex gap-1">
          <template x-for="t in tabs" :key="t.key">
            <button @click="tab = t.key"
                    :class="tab === t.key ? 'text-[var(--ink)] border-b-2 border-[var(--accent)]' : 'text-[var(--ink-3)] border-b-2 border-transparent hover:text-[var(--ink-2)]'"
                    class="px-4 py-3 text-[13.5px] font-medium transition"
                    x-text="t.label"></button>
          </template>
        </div>
      </div>

      <!-- ══════ MEMBERS TAB ══════ -->
      <div x-show="tab === 'members'" class="card overflow-hidden">
        <div class="px-5 py-4 border-b border-[var(--border)] flex items-center justify-between">
          <h3 class="font-display text-[20px]">Members</h3>
          <button x-show="group.status === 'FORMING'" @click="openAddMember()" class="btn-secondary !py-2 !px-4 !text-[12.5px] !w-auto">
            + Add member
          </button>
        </div>
        <table class="w-full">
          <thead class="bg-[var(--cream)]">
            <tr>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Name</th>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">NRC</th>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Role</th>
              <th class="text-right px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Savings</th>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Joined</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="m in (group.members || []).filter(x => x.is_active)" :key="m.id">
              <tr class="border-t border-[var(--border)]">
                <td class="px-5 py-3 text-[13.5px] font-medium" x-text="m.client_name"></td>
                <td class="px-5 py-3 font-mono text-[12.5px]" x-text="m.client_nrc"></td>
                <td class="px-5 py-3"><span class="pill pill-neutral" x-text="m.role"></span></td>
                <td class="px-5 py-3 text-right font-mono text-[13px] text-emerald-700 font-medium" x-text="fmtMoney(m.savings_balance)"></td>
                <td class="px-5 py-3 text-[12px] text-[var(--ink-3)] font-mono" x-text="m.joined_at"></td>
              </tr>
            </template>
            <tr x-show="!(group.members || []).filter(x => x.is_active).length">
              <td colspan="5" class="p-10 text-center text-[13px] text-[var(--ink-3)]">No members yet.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- ══════ MEETINGS TAB ══════ -->
      <div x-show="tab === 'meetings'" class="card overflow-hidden">
        <table class="w-full">
          <thead class="bg-[var(--cream)]">
            <tr>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">#</th>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Scheduled</th>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Actual</th>
              <th class="text-right px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Attendance</th>
              <th class="text-right px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Collected</th>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Status</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="m in (group.recent_meetings || [])" :key="m.id">
              <tr class="border-t border-[var(--border)]">
                <td class="px-5 py-3 font-mono text-[12.5px]" x-text="'#' + m.meeting_number"></td>
                <td class="px-5 py-3 text-[13px]" x-text="m.scheduled_date"></td>
                <td class="px-5 py-3 text-[13px] text-[var(--ink-3)]" x-text="m.actual_date || '—'"></td>
                <td class="px-5 py-3 text-right tabular-nums text-[13px]" x-text="m.attendance_count"></td>
                <td class="px-5 py-3 text-right font-mono text-[13px]" x-text="fmtMoney(m.collections_received)"></td>
                <td class="px-5 py-3"><span class="pill pill-neutral" x-text="m.status"></span></td>
              </tr>
            </template>
            <tr x-show="!(group.recent_meetings || []).length">
              <td colspan="6" class="p-10 text-center text-[13px] text-[var(--ink-3)]">No meetings yet.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- ══════ COLLECTIONS TAB ══════ -->
      <div x-show="tab === 'collections'" class="card overflow-hidden">
        <table class="w-full">
          <thead class="bg-[var(--cream)]">
            <tr>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Receipt #</th>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Date</th>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Channel</th>
              <th class="text-right px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Members</th>
              <th class="text-right px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Amount</th>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">By</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="c in (group.recent_collections || [])" :key="c.id">
              <tr class="border-t border-[var(--border)]">
                <td class="px-5 py-3 font-mono text-[12px]" x-text="c.collection_number"></td>
                <td class="px-5 py-3 text-[13px] font-mono text-[var(--ink-3)]" x-text="fmtDateTime(c.created_at)"></td>
                <td class="px-5 py-3"><span class="pill pill-info" x-text="c.channel"></span></td>
                <td class="px-5 py-3 text-right tabular-nums text-[13px]" x-text="c.member_count"></td>
                <td class="px-5 py-3 text-right font-mono text-[13.5px] font-bold" x-text="fmtMoney(c.amount)"></td>
                <td class="px-5 py-3 text-[12.5px]" x-text="c.created_by_name || '—'"></td>
              </tr>
            </template>
            <tr x-show="!(group.recent_collections || []).length">
              <td colspan="6" class="p-10 text-center text-[13px] text-[var(--ink-3)]">No collections yet.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- ══════ SAVINGS TAB ══════ -->
      <div x-show="tab === 'savings'" class="card overflow-hidden">
        <div class="px-5 py-4 border-b border-[var(--border)] flex items-center justify-between">
          <div>
            <h3 class="font-display text-[20px]">Member Savings</h3>
            <p class="text-[12.5px] text-[var(--ink-3)] mt-0.5">Weekly savings collected from members.</p>
          </div>
        </div>
        <table class="w-full">
          <thead class="bg-[var(--cream)]">
            <tr>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Member</th>
              <th class="text-left px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Role</th>
              <th class="text-right px-5 py-3 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Savings Balance</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="m in (group.members || []).filter(x => x.is_active)" :key="m.id">
              <tr class="border-t border-[var(--border)]">
                <td class="px-5 py-3 text-[13.5px] font-medium" x-text="m.client_name"></td>
                <td class="px-5 py-3"><span class="pill pill-neutral" x-text="m.role"></span></td>
                <td class="px-5 py-3 text-right font-mono text-[13px] font-bold text-emerald-700" x-text="fmtMoney(m.savings_balance)"></td>
              </tr>
            </template>
          </tbody>
          <tfoot class="bg-[var(--cream)] border-t border-[var(--border)]">
            <tr>
              <td colspan="2" class="px-5 py-3 text-[13px] font-bold text-right">GROUP TOTAL</td>
              <td class="px-5 py-3 text-right font-mono text-[14px] font-bold text-emerald-700" x-text="fmtMoney(group.savings_balance)"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </template>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- MODALS                                                    -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- 1. Add Member Modal -->
  <template x-teleport="body">
    <div x-show="showAddMember" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-black/40"
         @keydown.escape.window="showAddMember = false">
      <div class="flex min-h-full items-center justify-center p-4" @click.self="showAddMember = false">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden" @click.stop>
          <div class="p-6 border-b border-[var(--border)] shrink-0">
            <h3 class="font-display text-[22px]">Add member</h3>
          </div>
          <div class="p-6 space-y-4 overflow-y-auto">
            <div>
              <label class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono mb-1.5 block">Client</label>
              <select x-model="newMember.client" class="input">
                <option value="">Select client…</option>
                <template x-for="c in clients" :key="c.id">
                  <option :value="c.id" x-text="c.first_name + ' ' + c.last_name + ' — ' + c.nrc"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono mb-1.5 block">Role</label>
              <select x-model="newMember.role" class="input">
                <option value="MEMBER">Member</option>
                <option value="TREASURER">Treasurer</option>
                <option value="SECRETARY">Secretary</option>
              </select>
            </div>
            <div x-show="addErr" x-cloak class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-[13px] text-red-800" x-text="addErr"></div>
          </div>
          <div class="p-6 border-t border-[var(--border)] bg-[var(--cream)] flex justify-end gap-3 shrink-0">
            <button @click="showAddMember = false" class="px-4 py-2 text-[13.5px] text-[var(--ink-2)] font-medium">Cancel</button>
            <button @click="addMember()" :disabled="savingMember" class="btn-primary !w-auto !py-2 !px-5 !text-[13.5px] disabled:opacity-50">
              <span x-text="savingMember ? 'Adding…' : 'Add member'"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- 2. Schedule Meeting Modal -->
  <template x-teleport="body">
    <div x-show="showMeetingModal" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-black/40"
         @keydown.escape.window="showMeetingModal = false">
      <div class="flex min-h-full items-center justify-center p-4" @click.self="showMeetingModal = false">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden" @click.stop>
          <div class="p-6 border-b border-[var(--border)] shrink-0">
            <h3 class="font-display text-[22px]">Schedule Meeting</h3>
          </div>
          <div class="p-6 space-y-4 overflow-y-auto">
            <div>
              <label class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono mb-1.5 block">Date</label>
              <input type="date" x-model="meetingForm.date" class="input" />
            </div>
            <div>
              <label class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono mb-1.5 block">Agenda (optional)</label>
              <textarea x-model="meetingForm.agenda" rows="2" class="input" placeholder="e.g. Weekly savings collection"></textarea>
            </div>
            <div x-show="meetingErr" x-cloak class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-[13px] text-red-800" x-text="meetingErr"></div>
          </div>
          <div class="p-6 border-t border-[var(--border)] bg-[var(--cream)] flex justify-end gap-3 shrink-0">
            <button @click="showMeetingModal = false" class="px-4 py-2 text-[13.5px] text-[var(--ink-2)] font-medium">Cancel</button>
            <button @click="submitMeeting()" :disabled="savingMeeting" class="btn-primary !w-auto !py-2 !px-5 !text-[13.5px] disabled:opacity-50">
              <span x-text="savingMeeting ? 'Saving…' : 'Schedule'"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- 3. Record Collection Modal -->
  <template x-teleport="body">
    <div x-show="showCollect" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-black/40"
         @keydown.escape.window="showCollect = false">
      <div class="flex min-h-full items-center justify-center p-4" @click.self="showCollect = false">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden" @click.stop>
          
          <div class="p-6 border-b border-[var(--border)] shrink-0">
            <h3 class="font-display text-[24px] mb-2">Record Group Collection</h3>
            <p class="text-[13.5px] text-[var(--ink-2)]">
              Enter each member's contribution. The system will split the total across their individual loans.
            </p>
          </div>

          <div class="flex-1 overflow-y-auto p-6 space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono mb-1.5 block">Channel</label>
                <select x-model="collect.channel" class="input">
                  <option value="CASH">Cash</option>
                  <option value="BANK">Bank</option>
                  <option value="MTN_MOMO">MTN MoMo</option>
                  <option value="AIRTEL_MONEY">Airtel Money</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <label class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono mb-1.5 block">Reference (optional)</label>
                <input x-model="collect.reference" class="input" placeholder="Receipt # / transaction ref" />
              </div>
            </div>

            <div class="card overflow-hidden !border-[var(--border-2)]">
              <table class="w-full">
                <thead class="bg-[var(--cream)] border-b border-[var(--border)]">
                  <tr>
                    <th class="text-left px-4 py-2.5 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Member</th>
                    <th class="text-right px-4 py-2.5 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Balance</th>
                    <th class="text-right px-4 py-2.5 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium w-40">Contribution</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="m in (group.members || []).filter(x => x.is_active)" :key="m.id">
                    <tr class="border-b border-[var(--border)] last:border-0">
                      <td class="px-4 py-2.5">
                        <div class="text-[13.5px] font-medium" x-text="m.client_name"></div>
                        <div class="text-[11px] text-[var(--ink-3)] font-mono" x-text="m.role"></div>
                      </td>
                      <td class="px-4 py-2.5 text-right font-mono text-[13px] text-[var(--ink-3)]"
                          x-text="memberBalance(m.client) !== null ? fmtMoney(memberBalance(m.client)) : '—'"></td>
                      <td class="px-4 py-2.5 text-right">
                        <input type="number" step="0.01" min="0"
                               x-model.number="collect.amounts[m.id]"
                               class="input !text-right !py-1.5 !w-full font-mono" placeholder="0.00" />
                      </td>
                    </tr>
                  </template>
                </tbody>
                <tfoot class="bg-[var(--cream)] border-t-2 border-[var(--ink)]">
                  <tr>
                    <td colspan="2" class="px-4 py-3 text-[13px] font-bold">TOTAL</td>
                    <td class="px-4 py-3 text-right font-mono text-[15px] font-bold" x-text="fmtMoney(collectTotal())"></td>
                  </tr>
                </tfoot>
              </table>
            </div>

            <div x-show="collectErr" x-cloak class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-[13px] text-red-800" x-text="collectErr"></div>
          </div>

          <div class="p-6 border-t border-[var(--border)] bg-[var(--cream)] flex justify-end gap-3 shrink-0">
            <button @click="showCollect = false" class="px-4 py-2 text-[13.5px] font-medium text-[var(--ink-2)]">Cancel</button>
            <button @click="submitCollection()" :disabled="collecting" class="btn-primary !w-auto !py-2 !px-6 !text-[13.5px] disabled:opacity-50">
              <span x-text="collecting ? 'Recording…' : 'Record ' + fmtMoney(collectTotal())"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- 4. Record Savings Modal -->
  <template x-teleport="body">
    <div x-show="showSavings" x-cloak class="fixed inset-0 z-50 overflow-y-auto bg-black/40"
         @keydown.escape.window="showSavings = false">
      <div class="flex min-h-full items-center justify-center p-4" @click.self="showSavings = false">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden" @click.stop>
          
          <div class="p-6 border-b border-[var(--border)] shrink-0">
            <h3 class="font-display text-[24px] mb-2">Record Member Savings</h3>
            <p class="text-[13.5px] text-[var(--ink-2)]">Enter the savings deposit for each member.</p>
          </div>

          <div class="flex-1 overflow-y-auto p-6 space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono mb-1.5 block">Channel</label>
                <select x-model="savingsForm.channel" class="input">
                  <option value="CASH">Cash</option>
                  <option value="BANK">Bank</option>
                  <option value="MTN_MOMO">MTN MoMo</option>
                  <option value="AIRTEL_MONEY">Airtel Money</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <label class="text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono mb-1.5 block">Reference (optional)</label>
                <input x-model="savingsForm.reference" class="input" placeholder="Receipt #" />
              </div>
            </div>

            <div class="card overflow-hidden !border-[var(--border-2)]">
              <table class="w-full">
                <thead class="bg-[var(--cream)] border-b border-[var(--border)]">
                  <tr>
                    <th class="text-left px-4 py-2.5 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium">Member</th>
                    <th class="text-right px-4 py-2.5 text-[11px] uppercase tracking-wider text-[var(--ink-3)] font-mono font-medium w-40">Deposit Amount</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="m in (group.members || []).filter(x => x.is_active)" :key="m.id">
                    <tr class="border-b border-[var(--border)] last:border-0">
                      <td class="px-4 py-2.5 text-[13.5px] font-medium" x-text="m.client_name"></td>
                      <td class="px-4 py-2.5 text-right">
                        <input type="number" step="0.01" min="0"
                               x-model.number="savingsForm.amounts[m.id]"
                               class="input !text-right !py-1.5 !w-full font-mono" placeholder="0.00" />
                      </td>
                    </tr>
                  </template>
                </tbody>
                <tfoot class="bg-[var(--cream)] border-t-2 border-[var(--ink)]">
                  <tr>
                    <td class="px-4 py-3 text-[13px] font-bold text-right">TOTAL</td>
                    <td class="px-4 py-3 text-right font-mono text-[15px] font-bold" x-text="fmtMoney(savingsTotal())"></td>
                  </tr>
                </tfoot>
              </table>
            </div>

            <div x-show="savingsErr" x-cloak class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-[13px] text-red-800" x-text="savingsErr"></div>
          </div>

          <div class="p-6 border-t border-[var(--border)] bg-[var(--cream)] flex justify-end gap-3 shrink-0">
            <button @click="showSavings = false" class="px-4 py-2 text-[13.5px] font-medium text-[var(--ink-2)]">Cancel</button>
            <button @click="submitSavings()" :disabled="savingSavings" class="btn-primary !w-auto !py-2 !px-6 !text-[13.5px] disabled:opacity-50">
              <span x-text="savingSavings ? 'Recording…' : 'Record ' + fmtMoney(savingsTotal())"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
function groupDetail(groupId) {
  return {
    groupId, group: null,
    clients: [],
    loansByClient: {},
    loading: true,
    tab: 'members',
    tabs: [
      { key: 'members',     label: 'Members' },
      { key: 'meetings',    label: 'Meetings' },
      { key: 'collections', label: 'Collections' },
      { key: 'savings',     label: 'Savings' },
    ],
    flashError: '', flashSuccess: '',

    // Add Member Modal
    showAddMember: false, savingMember: false, addErr: '',
    newMember: { client: '', role: 'MEMBER' },

    // Schedule Meeting Modal
    showMeetingModal: false, savingMeeting: false, meetingErr: '',
    meetingForm: { date: '', agenda: '' },

    // Collection Modal
    showCollect: false, collecting: false, collectErr: '',
    collect: { channel: 'CASH', reference: '', amounts: {} },

    // Savings Modal
    showSavings: false, savingSavings: false, savingsErr: '',
    savingsForm: { channel: 'CASH', reference: '', amounts: {} },

    async init() {
      await Promise.all([this.load(), this.loadClients()]);
      this.loading = false;
    },

    getToken() { return localStorage.getItem('access_token') || sessionStorage.getItem('access_token'); },
    
    async api(url, opts = {}) {
      const r = await fetch(url, { 
        ...opts, 
        headers: { 
          'Authorization': 'Bearer ' + this.getToken(), 
          'Content-Type': 'application/json', 
          ...(opts.headers || {}) 
        } 
      });
      if (!r.ok) { 
        const e = await r.json().catch(() => ({})); 
        throw new Error(e.error || e.detail || ('HTTP ' + r.status)); 
      }
      return r.json();
    },

    async load() {
      try {
        this.group = await this.api('/api/loans/groups/' + this.groupId + '/');
        await this.loadLoans();
      } catch (e) { this.flashError = e.message; }
    },

    async loadLoans() {
      try {
        const d = await this.api('/api/loans/admin/?page_size=200');
        const all = d.results || d;
        for (const loan of all) {
          if (loan.client && !this.loansByClient[loan.client] && loan.balance_due > 0) {
            this.loansByClient[loan.client] = loan;
          }
        }
      } catch (e) {}
    },

    async loadClients() {
      try { 
        const d = await this.api('/api/clients/?page_size=500&is_active=true&kyc_status=VERIFIED'); 
        this.clients = d.results || d; 
      } catch (e) {}
    },

    memberBalance(clientId) {
      const l = this.loansByClient[clientId];
      return l ? Number(l.balance_due || 0) : null;
    },

    // --- Actions ---
    
    async startCycle() {
      if (!confirm('Start the lending cycle for this group?')) return;
      try {
        await this.api('/api/loans/groups/' + this.groupId + '/start_cycle/', { method: 'POST', body: JSON.stringify({ duration_months: 12 }) });
        await this.load();
        this.flashSuccess = 'Cycle started.';
        setTimeout(() => this.flashSuccess = '', 4000);
      } catch (e) { this.flashError = e.message; setTimeout(() => this.flashError = '', 5000); }
    },

    async closeCycle() {
      if (!confirm('Are you sure? This will close the group cycle permanently.')) return;
      try {
        await this.api('/api/loans/groups/' + this.groupId + '/close_cycle/', { method: 'POST', body: JSON.stringify({ notes: 'Closed from UI' }) });
        await this.load();
        this.flashSuccess = 'Cycle closed.';
        setTimeout(() => this.flashSuccess = '', 4000);
      } catch (e) { this.flashError = e.message; }
    },

    // --- Modals: Member ---
    openAddMember() { this.newMember = { client: '', role: 'MEMBER' }; this.addErr = ''; this.showAddMember = true; },
    async addMember() {
      if (!this.newMember.client) { this.addErr = 'Select a client.'; return; }
      this.savingMember = true;
      try {
        await this.api('/api/loans/groups/' + this.groupId + '/add_member/', {
          method: 'POST', body: JSON.stringify(this.newMember),
        });
        this.showAddMember = false;
        this.flashSuccess = 'Member added.';
        setTimeout(() => this.flashSuccess = '', 4000);
        await this.load();
      } catch (e) { this.addErr = e.message; }
      finally { this.savingMember = false; }
    },

    // --- Modals: Meeting ---
    promptMeeting() {
      this.meetingForm = { date: new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10), agenda: '' };
      this.meetingErr = '';
      this.showMeetingModal = true;
    },
    async submitMeeting() {
      if (!this.meetingForm.date) { this.meetingErr = 'Date is required.'; return; }
      this.savingMeeting = true;
      try {
        await this.api('/api/loans/groups/' + this.groupId + '/schedule_meeting/', {
          method: 'POST', body: JSON.stringify({ scheduled_date: this.meetingForm.date, agenda: this.meetingForm.agenda }),
        });
        this.showMeetingModal = false;
        this.flashSuccess = 'Meeting scheduled.';
        setTimeout(() => this.flashSuccess = '', 4000);
        await this.load();
      } catch (e) { this.meetingErr = e.message; }
      finally { this.savingMeeting = false; }
    },

    // --- Modals: Collection ---
    promptCollection() {
      this.collect = { channel: 'CASH', reference: '', amounts: {} };
      (this.group.members || []).filter(m => m.is_active).forEach(m => {
        this.collect.amounts[m.id] = 0;
      });
      this.collectErr = '';
      this.showCollect = true;
    },
    collectTotal() {
      return Object.values(this.collect.amounts || {}).reduce((s, v) => s + Number(v || 0), 0);
    },
    async submitCollection() {
      const allocations = Object.entries(this.collect.amounts)
        .filter(([_, amt]) => Number(amt) > 0)
        .map(([member_id, amount]) => ({ member_id, amount: Number(amount) }));

      if (!allocations.length) { this.collectErr = 'Enter at least one amount.'; return; }

      this.collecting = true; this.collectErr = '';
      try {
        await this.api('/api/loans/groups/' + this.groupId + '/record_collection/', {
          method: 'POST',
          body: JSON.stringify({
            channel: this.collect.channel,
            reference: this.collect.reference,
            allocations,
          }),
        });
        this.showCollect = false;
        this.flashSuccess = 'Collection recorded: ' + this.fmtMoney(this.collectTotal());
        setTimeout(() => this.flashSuccess = '', 5000);
        await this.load();
      } catch (e) { this.collectErr = e.message; }
      finally { this.collecting = false; }
    },

    // --- Modals: Savings ---
    promptSavings() {
      this.savingsForm = { channel: 'CASH', reference: '', amounts: {} };
      (this.group.members || []).filter(m => m.is_active).forEach(m => {
        this.savingsForm.amounts[m.id] = 0;
      });
      this.savingsErr = '';
      this.showSavings = true;
    },
    savingsTotal() {
      return Object.values(this.savingsForm.amounts || {}).reduce((s, v) => s + Number(v || 0), 0);
    },
    async submitSavings() {
      const allocations = Object.entries(this.savingsForm.amounts)
        .filter(([_, amt]) => Number(amt) > 0)
        .map(([member_id, amount]) => ({ member_id, amount: Number(amount) }));

      if (!allocations.length) { this.savingsErr = 'Enter at least one amount.'; return; }

      this.savingSavings = true; this.savingsErr = '';
      try {
        await this.api('/api/loans/groups/' + this.groupId + '/record_savings/', {
          method: 'POST',
          body: JSON.stringify({
            channel: this.savingsForm.channel,
            reference: this.savingsForm.reference,
            allocations,
          }),
        });
        this.showSavings = false;
        this.flashSuccess = 'Savings recorded: ' + this.fmtMoney(this.savingsTotal());
        setTimeout(() => this.flashSuccess = '', 5000);
        await this.load();
      } catch (e) { this.savingsErr = e.message; }
      finally { this.savingSavings = false; }
    },

    // --- Helpers ---
    fmtMoney(v) { const n = Number(v || 0); return 'K ' + n.toLocaleString('en-ZM', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
    fmtDateTime(iso) { if (!iso) return '—'; return new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); },
    prettyStatus(s) { return { FORMING: 'Forming', ACTIVE: 'Active', SUSPENDED: 'Suspended', CLOSED: 'Closed' }[s] || s; },
    statusPill(s) { return { FORMING: 'pill-warning', ACTIVE: 'pill-success', SUSPENDED: 'pill-danger', CLOSED: 'pill-neutral' }[s] || 'pill-neutral'; },
  };
}
document.addEventListener('alpine:init', () => Alpine.data('groupDetail', groupDetail));
</script>
{% endblock %}

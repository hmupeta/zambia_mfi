{% extends "auth/base_auth.html" %}
{% block title %}Forgot password — Nimbus Investment Ltd{% endblock %}

{% block form %}
<div>
  <h1 class="font-display text-[38px] sm:text-[44px] leading-[1.05] tracking-tight">Reset your password</h1>
  <p class="mt-3 text-[15px] text-[var(--ink-2)]">
    Enter your email address. We'll send you a link to reset your password.
  </p>
</div>

<div id="success" class="hidden mt-6 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-[14px] text-emerald-800"></div>
<div id="error" class="hidden mt-6 error-box"></div>

<form id="reset-form" class="mt-8 space-y-5">
  <div>
    <label for="email" class="label">Email address</label>
    <input type="email" id="email" name="email" class="input" placeholder="you@company.zm" required autofocus />
  </div>

  <button type="submit" id="submit-btn" class="btn-primary">
    <span id="submit-text">Send reset link</span>
    <svg id="submit-spinner" class="hidden animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
    </svg>
  </button>
</form>

<div class="mt-8 pt-8 border-t border-[var(--border)] text-center">
  <a href="/login/" class="text-[14px] font-medium text-[var(--accent)] hover:underline">
    ← Back to sign in
  </a>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById('reset-form');
  const errorBox = document.getElementById('error');
  const successBox = document.getElementById('success');
  const btn = document.getElementById('submit-btn');
  const btnText = document.getElementById('submit-text');
  const spinner = document.getElementById('submit-spinner');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('hidden');
    successBox.classList.add('hidden');
    btn.disabled = true;
    btnText.textContent = 'Sending…';
    spinner.classList.remove('hidden');

    // Placeholder — replace with a real endpoint when ready
    setTimeout(() => {
      successBox.textContent = 'If an account exists for that email, you will receive a reset link shortly.';
      successBox.classList.remove('hidden');
      btn.disabled = false;
      btnText.textContent = 'Send reset link';
      spinner.classList.add('hidden');
      form.reset();
    }, 800);
  });
</script>
{% endblock %}

{% extends "auth/base_auth.html" %}
{% block title %}Set new password — Nimbus Investment Ltd{% endblock %}

{% block form %}
<div>
  <h1 class="font-display text-[38px] sm:text-[44px] leading-[1.05] tracking-tight">Set a new password</h1>
  <p class="mt-3 text-[15px] text-[var(--ink-2)]">
    Choose a strong password you haven't used before.
  </p>
</div>

<div id="error" class="hidden mt-6 error-box"></div>

<form id="reset-form" class="mt-8 space-y-5">
  <div>
    <label for="password" class="label">New password</label>
    <input type="password" id="password" class="input" placeholder="At least 10 characters" required minlength="10" autocomplete="new-password" />
  </div>

  <div>
    <label for="password_confirm" class="label">Confirm password</label>
    <input type="password" id="password_confirm" class="input" placeholder="Re-enter new password" required autocomplete="new-password" />
  </div>

  <button type="submit" id="submit-btn" class="btn-primary">
    <span id="submit-text">Set password</span>
  </button>
</form>

<div class="mt-8 pt-8 border-t border-[var(--border)] text-center">
  <a href="/login/" class="text-[14px] font-medium text-[var(--accent)] hover:underline">← Back to sign in</a>
</div>
{% endblock %}

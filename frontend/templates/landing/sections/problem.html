{% load nimbus_icons %}
<section class="py-28 lg:py-32 bg-[var(--cream)]">
  <div class="max-w-[1280px] mx-auto px-6 lg:px-8">
    <div class="max-w-3xl mb-16 reveal">
      {% if section.eyebrow %}<div class="eyebrow mb-5">{{ section.eyebrow }}</div>{% endif %}
      <h2 class="font-display text-[42px] sm:text-[56px] lg:text-[64px] leading-[1.02] text-[var(--ink)]">
        {{ section.title }}
      </h2>
      {% if section.subtitle %}<p class="mt-6 text-[17px] text-[var(--ink-2)] leading-[1.7] max-w-2xl">{{ section.subtitle }}</p>{% endif %}
    </div>

    <div class="grid md:grid-cols-3 gap-6">
      {% for item in section.visible_items %}
      <div class="reveal reveal-d{{ forloop.counter }} group bg-white rounded-2xl p-8 border border-[var(--border)] card-lift">
        {% if item.icon %}
        <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-6 transition group-hover:scale-105"
             style="background: color-mix(in srgb, var(--accent) 10%, transparent);">
          <svg class="h-5.5 w-5.5" style="color: var(--accent); width: 22px; height: 22px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="{% icon_path item.icon %}"/>
          </svg>
        </div>
        {% endif %}
        <h3 class="text-[19px] font-semibold text-[var(--ink)] mb-3 tracking-tight">{{ item.title }}</h3>
        <p class="text-[15px] text-[var(--ink-2)] leading-[1.65]">{{ item.description }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

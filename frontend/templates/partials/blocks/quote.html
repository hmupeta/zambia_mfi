<section class="py-20 bg-{% if block.background == 'cream' %}[var(--cream)]{% else %}white{% endif %}">
  <div class="max-w-[840px] mx-auto px-6 text-center">
    <div class="w-10 h-10 rounded-full mx-auto mb-6 flex items-center justify-center" style="background: color-mix(in srgb, var(--accent) 15%, transparent);">
      <svg class="h-4 w-4" style="color: var(--accent);" fill="currentColor" viewBox="0 0 24 24"><path d="M4.583 17.321C3.553 16.227 3 15 3 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 01-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179zm10 0C13.553 16.227 13 15 13 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 01-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179z"/></svg>
    </div>
    <p class="font-display text-[28px] sm:text-[36px] leading-[1.3] text-[var(--ink)]">"{{ block.body }}"</p>
    {% if block.title %}
    <p class="mt-6 text-[14px] text-[var(--ink-3)]">— {{ block.title }}{% if block.subtitle %}, {{ block.subtitle }}{% endif %}</p>
    {% endif %}
  </div>
</section>
